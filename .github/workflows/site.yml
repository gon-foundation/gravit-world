name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Build check only. The sites are deployed to the Namecheap host from the
# maintainer's machine; the old SFTP upload to Hostpoint hung until the 6 h
# job limit after Hostpoint closed (20 Oct 2026) and used up the Actions budget.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preview build
        run: python build.py
      - name: Production readiness (fails while placeholder texts remain)
        continue-on-error: true
        run: python build.py --production

